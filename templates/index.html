    <p class="intro-description">
        中国与海洋、与世界打交道的方式，从南到北有什么不同？

</section>

        </g>

        <!-- 罗盘 -->
        <g transform="translate(720, 50)" opacity="0.55">
            <circle cx="0" cy="0" r="22" fill="none" stroke="var(--map-coast)" stroke-width="0.5"/>
            <polygon points="0,-24 4,-7 -4,-7" fill="var(--map-coast)"/>
            <polygon points="0,24 4,7 -4,7" fill="var(--map-grid)" opacity="0.4"/>
            <polygon points="24,0 7,4 7,-4" fill="var(--map-grid)" opacity="0.4"/>
            <polygon points="-24,0 -7,4 -7,-4" fill="var(--map-grid)" opacity="0.4"/>
            <text x="0" y="-28" text-anchor="middle" fill="var(--map-coast)" font-size="10" font-weight="600">N</text>
        </g>

        <!-- 城市 -->
        {% for city in cities %}
        {% set x = [171, 356, 432, 498, 574, 612, 618, 547, 618, 492, 558, 394, 340, 514, 623][loop.index0] %}
        {% set y = [556, 546, 512, 462, 403, 382, 344, 332, 304, 198, 152, 52, 33, 33, 64][loop.index0] %}
        <g class="city-marker" data-city="{{ city.slug }}">
            <circle cx="{{ x }}" cy="{{ y }}" r="12" fill="var(--map-dot-glow)" class="city-glow"/>
            <circle cx="{{ x }}" cy="{{ y }}" r="6"
                    fill="var(--map-dot)" stroke="var(--map-dot-stroke)" stroke-width="1.5"
                    class="city-dot"/>
            <text x="{{ x }}" y="{{ y - 16 }}" text-anchor="middle"
                  fill="var(--map-text)" font-size="12" font-weight="500"
                  class="city-label">{{ city.name }}</text>
            <a href="{{ prefix }}/cities/{{ city.slug }}/">
                <rect x="{{ x - 50 }}" y="{{ y - 45 }}" width="100" height="65"
                      fill="transparent" class="city-hitarea"/>
            </a>
        </g>

<section class="city-list-section">
    <h2 class="section-title">站点一览</h2>
    <div class="city-grid">
        {% for city in cities %}
        <a href="{{ prefix }}/cities/{{ city.slug }}/" class="city-card">
            <span class="city-card-emoji">{{ city.emoji }}</span>
            <span class="city-card-order">第{{ city.order }}站</span>
            <span class="city-card-name">{{ city.name }}</span>
            <span class="city-card-theme">{{ city.theme }}</span>
        </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
